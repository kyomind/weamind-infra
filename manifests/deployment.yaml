apiVersion: apps/v1
kind: Deployment
metadata:
  name: weamind
  namespace: weamind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weamind # Deployment 透過這個 label 找到它管理的 Pod
  template: # Pod 模板：定義每個 Pod 的配置
    metadata:
      labels:
        app: weamind # Pod 的 label，必須與上面的 selector 一致
    spec:
      automountServiceAccountToken: false # 應用不呼叫 K8s API，不掛 SA token
      nodeSelector:
        nodepool: worker # 只在 worker 節點上排程，避免佔用 control-plane
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule # 排不開就 Pending，不擠到同一台；節點回來後自動排回
          labelSelector:
            matchLabels:
              app: weamind
          matchLabelKeys:
            - pod-template-hash # 只計算同一個 ReplicaSet 的 Pod，滾動更新時不把舊 Pod 算進去
      containers:
        - name: app
          image: ghcr.io/kyomind/weamind:1.3.0
          imagePullPolicy: Always # 每次部署都重新拉取 image，確保使用最新版本
          command: # 明確指定啟動指令（覆蓋 Dockerfile 的 CMD/ENTRYPOINT）
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1" # Step 3 診斷：先用單 worker 驗證 metrics 序列是否恢復可解讀性
            - --proxy-headers # 信任代理 headers（X-Forwarded-* 等）
            - --loop
            - uvloop # 使用高效能的 uvloop
            - --http
            - httptools
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          envFrom: # 批次注入環境變數（比 env 更簡潔）
            - configMapRef:
                name: weamind-config # 注入非敏感配置
            - secretRef:
                name: weamind-secret # 注入敏感資料（會自動 base64 decode）
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5 # 啟動後等 5 秒才開始檢查
            periodSeconds: 10 # 每 10 秒檢查一次
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15 # 給 app 更多時間啟動（避免誤殺）
            periodSeconds: 20 # 每 20 秒檢查一次
