apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkmind-rollout
  namespace: darkmind
  labels:
    app: darkmind-rollout
    app.kubernetes.io/name: darkmind
    app.kubernetes.io/component: bad-rollout
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: darkmind-rollout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: darkmind-rollout
        app.kubernetes.io/name: darkmind
        app.kubernetes.io/component: bad-rollout
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: darkmind-rollout
  namespace: darkmind
  labels:
    app: darkmind-rollout
    app.kubernetes.io/name: darkmind
    app.kubernetes.io/component: bad-rollout
spec:
  type: ClusterIP
  selector:
    app: darkmind-rollout
  ports:
    - name: http
      port: 80
      targetPort: http

