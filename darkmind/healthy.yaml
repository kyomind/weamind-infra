apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkmind-healthy
  namespace: darkmind
  labels:
    app: darkmind-healthy
    app.kubernetes.io/name: darkmind
    app.kubernetes.io/component: healthy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: darkmind-healthy
  template:
    metadata:
      labels:
        app: darkmind-healthy
        app.kubernetes.io/name: darkmind
        app.kubernetes.io/component: healthy
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: darkmind-healthy
  namespace: darkmind
  labels:
    app: darkmind-healthy
    app.kubernetes.io/name: darkmind
    app.kubernetes.io/component: healthy
spec:
  type: ClusterIP
  selector:
    app: darkmind-healthy
  ports:
    - name: http
      port: 80
      targetPort: http

